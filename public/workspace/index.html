<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axon – Document Intelligence Workspace</title>
  <meta name="description" content="Axon is an AI-powered document intelligence workspace. Upload PDFs and TXT files, then chat with your documents using natural language.">

  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Config & Supabase must load before ES modules -->
  <script src="config.js?v=2"></script>
  <script src="vendor/supabase.js?v=2"></script>

  <link rel="stylesheet" href="css/base.css?v=2">
  <link rel="stylesheet" href="css/themes.css?v=2">
  <link rel="stylesheet" href="css/animations.css?v=2">
  <link rel="stylesheet" href="css/layout.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">

  <style>
    /* ── Login screen ─────────────────────────────────────────── */
    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #login-card {
      width: 320px;
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 10px;
      padding: 36px 32px;
      text-align: center;
    }

    #login-card h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.02em;
    }

    #login-card p {
      margin: 0 0 28px;
      font-size: 13px;
      color: #888;
    }

    #google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    #google-btn:hover { background: #f0f0f0; }

    #login-error {
      display: none;
      margin-top: 16px;
      font-size: 12px;
      color: #e05a5a;
      line-height: 1.5;
      text-align: left;
      word-break: break-word;
    }

    /* ── App shell ────────────────────────────────────────────── */
    /* display is controlled entirely by inline style in auth.js */
    #app-shell {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      background: #111;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════ LOGIN SCREEN ═══════════════════════════ -->
<div id="login-screen">
  <div id="login-card">
    <h1>Axon</h1>
    <p>Document Intelligence Workspace</p>
    <button id="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ═══════════════════════════ APP SHELL ═════════════════════════════ -->
<!-- display is set to 'flex' by auth.js _showApp() when session exists -->
<div id="app-shell" style="display:none">

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside id="sidebar" class="collapsed">
    <div class="sidebar-header">
      <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1 class="sidebar-text">Axon</h1>
    </div>

    <div class="sidebar-content">
      <div class="section-title sidebar-hide-collapsed" style="margin-top: 12px;">Menu</div>
      <div class="sidebar-menu">
        <button class="sidebar-menu-btn" onclick="alert('New Chat selected')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          <span class="sidebar-text">New Chat</span>
        </button>
        <button class="sidebar-menu-btn" onclick="alert('History selected')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span class="sidebar-text">History</span>
        </button>
      </div>

      <div class="section-title sidebar-hide-collapsed">Knowledge Base</div>
      <div class="kb-stats sidebar-hide-collapsed">
        <div class="stat-row">
          <span>Total Documents</span>
          <span class="stat-val" id="total-docs">0</span>
        </div>
        <div class="stat-row">
          <span>Total Storage</span>
          <span class="stat-val" id="total-storage">0 MB</span>
        </div>
        <div class="stat-row">
          <span>Updated</span>
          <span class="stat-val" id="last-updated">Just now</span>
        </div>
      </div>

      <div class="section-title sidebar-hide-collapsed" style="margin-top:32px;">
        Document Library
        <button class="refresh-btn" onclick="loadDocuments()">Refresh</button>
      </div>
      <div class="doc-list sidebar-hide-collapsed" id="doc-list">
        <!-- Documents injected via JS -->
      </div>
    </div>

    <!-- Profile row at the bottom of the sidebar -->
    <div class="sidebar-bottom" style="padding: 0;">
      <div id="sidebar-profile" class="sidebar-hide-collapsed">
        <!-- Filled by auth.js _renderProfile() after sign-in -->
      </div>
      <button class="sidebar-menu-btn" onclick="openSettingsModal()" style="margin: 4px 8px 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span class="sidebar-text">Settings</span>
      </button>
    </div>
  </aside>

  <input type="file" id="file-input" accept=".pdf,.txt,.docx" multiple onchange="handleFileSelect(event)" style="display: none;">

  <main>
    <div class="top-bar">
      <div class="top-bar-left mobile-only">
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
      <select id="doc-scope" class="scope-select">
        <option value="">Search all documents</option>
      </select>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="chat-container" id="messages">
        <div class="empty-state" id="empty-state">
          <h2>Chat with your documents.</h2>
        </div>
      </div>
    </div>

    <button class="floating-pdf-toggle" onclick="togglePdfPane()" id="floating-pdf-toggle" title="Show PDF Pane">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    </button>

    <div class="input-area">
      <div class="input-container-wrapper" style="width: 100%; max-width: 720px; display: flex; flex-direction: column;">
        <div class="uploaded-docs-pills" id="docs-pills"></div>
        <div class="input-container">
          <button class="upload-icon-btn" onclick="document.getElementById('file-input').click()" title="Upload Document">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <textarea class="chat-input" id="question-input" rows="1"
            placeholder="Ask Axon anything about your documents..."
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"></textarea>
          <div class="input-actions">
            <button class="msg-action-btn mic-btn" id="mic-btn" onclick="toggleVoiceRecord()" title="Voice input" style="margin-right:4px;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
            <button class="send-btn" id="send-btn" onclick="sendQuestion()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <aside id="pdf-pane" class="collapsed">
    <div class="pdf-pane-header">
      <h2 style="font-size: 16px; font-weight: 600; color: var(--text-primary);">Document Preview</h2>
      <button class="toggle-sidebar-btn" onclick="togglePdfPane()" title="Toggle PDF Pane">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg>
      </button>
    </div>
    <div class="pdf-pane-content">
      <div class="dummy-pdf">
        <div class="dummy-pdf-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        </div>
      </div>
    </div>
  </aside>

  <div class="upload-toast" id="upload-toast">Uploading...</div>

  <div class="modal-overlay" id="settings-modal" onclick="closeSettingsModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close-btn" onclick="closeSettingsModal(event)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label>Language</label>
          <select class="settings-select">
            <option value="en">English</option>
            <option value="es" disabled>Spanish</option>
          </select>
        </div>
        <div class="settings-group" style="margin-top: 32px; border-top: 1px solid var(--border-subtle); padding-top: 24px;">
          <button class="btn-danger" onclick="alert('History cleared (placeholder)')">Clear Chat History</button>
        </div>
      </div>
    </div>
  </div>

</div> <!-- end #app-shell -->

<!-- ES module entry -->
<script type="module" src="js/main.js?v=2"></script>

</body>
</html>
